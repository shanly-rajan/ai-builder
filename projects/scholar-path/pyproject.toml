[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarpath"
version = "0.1.0"
description = "Evidence-backed research-degree Supervisor discovery and Research Fit system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=1.6.0,<2",
    "langchain-openai>=1.6.0,<2",
    "langchain-tavily==0.2.17",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langsmith>=0.11.2,<1",
    "mem0ai==2.0.19",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "streamlit==1.62.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = { scholarpath = "src" }
packages = [
    "scholarpath",
    "scholarpath.agents",
    "scholarpath.domain",
    "scholarpath.evaluation",
    "scholarpath.graph",
    "scholarpath.memory",
    "scholarpath.observability",
    "scholarpath.tools",
    "scholarpath.ui",
]

[tool.setuptools.package-data]
scholarpath = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not live",
    "--cov=scholarpath",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "live: requires explicit opt-in and provider credentials; excluded by default",
]

[tool.coverage.run]
branch = true
source = ["scholarpath"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["scholarpath", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mem0", "mem0.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["build", "venv"]
pythonVersion = "3.12"
venvPath = "."
venv = "venv"
typeCheckingMode = "standard"
