name: ScholarPath CI

on:
  push:
    paths:
      - "projects/scholar-path/**"
      - ".github/workflows/scholarpath-ci.yml"
  pull_request:
    paths:
      - "projects/scholar-path/**"
      - ".github/workflows/scholarpath-ci.yml"

permissions:
  contents: read

concurrency:
  group: scholarpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/scholar-path

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/scholar-path/pyproject.toml

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Run non-live tests
        run: pytest -m "not live"
